<div class="w-full bg-orange-500 py-8 mt-10 font-sans text-white">

  <div class="relative mx-auto max-w-7xl px-4">

    <button
      (click)="scroll('left')"
      class="absolute left-0 top-1/2 z-10 -translate-y-1/2 -translate-x-2 md:-translate-x-6
             flex h-10 w-10 items-center justify-center rounded-full bg-white text-green-700 shadow-lg
             transition-transform hover:scale-110 active:scale-95 cursor-pointer">
      <lucide-angular [img]="flechaIzquierda"></lucide-angular>
    </button>

    <div
      #scrollContainer
      class="flex snap-x snap-mandatory scroll-smooth gap-5 overflow-x-auto px-2 pb-4
         [&::-webkit-scrollbar]:hidden [-ms-overflow-style:none] [scrollbar-width:none]">

      @for (item of items(); track item.id) {
        <div class="snap-center shrink-0 relative flex h-[280px] w-full md:w-[45%] lg:w-[32%]
                    items-center justify-between overflow-hidden rounded-2xl
                    bg-gradient-to-br from-green-600 to-green-900 p-6 shadow-xl">

          <div class="relative w-1/3 shrink-0">
            <img [src]="'https://placehold.co/100x200/transparent/white?text=Botella'"
                 alt="Botella"
                 class="mx-auto h-40 object-contain drop-shadow-2xl filter">
          </div>

          <div class="flex w-2/3 flex-col items-start pl-4">

            @if (item.type === 'discount') {
              <div class="flex flex-col leading-none">
                <span class="text-xs font-bold uppercase tracking-wide">HASTA</span>
                <span class="text-[4rem] font-black tracking-tighter leading-[0.9]">{{ item.value }}</span>
                <span class="self-end text-xs font-bold uppercase tracking-wide">DESCT.</span>
              </div>
              <p class="mt-2 text-sm font-medium">{{ item.title }}</p>
            }

            @if (item.type === 'price') {
              <div class="w-full rounded-lg bg-white p-3 text-center shadow-md">
                <span class="block text-[10px] font-bold text-gray-500 uppercase">PRECIO OFERTA</span>
                <span class="block text-3xl font-bold text-green-700">{{ item.value }}</span>
                <span class="block text-[10px] text-gray-400 line-through">Precio regular {{ item.regularPrice }}</span>
              </div>
              <div class="mt-2 text-left">
                <p class="text-sm font-bold leading-tight">{{ item.title }}</p>
                <p class="text-xs font-light opacity-90">{{ item.subtitle }}</p>
              </div>
            }

          </div>
        </div>
      }

    </div>

    <button
      (click)="scroll('right')"
      class="absolute right-0 top-1/2 z-10 -translate-y-1/2 translate-x-2 md:translate-x-6
             flex h-10 w-10 items-center justify-center rounded-full bg-white text-green-700 shadow-lg
             transition-transform hover:scale-110 active:scale-95 cursor-pointer">
      <lucide-angular [img]="flechaDerecha"></lucide-angular>
    </button>

  </div>
</div>
